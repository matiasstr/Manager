<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --ink:#1c1f24; --muted:#6a7180; --line:#e2dfd7; --accent:#0f7a68; --soft:#e4f2ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101216; --panel:#181b21; --ink:#e8eaee; --muted:#8f97a6; --line:#2a2f38; --accent:#5ec9b3; --soft:#17302b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 16px 80px; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  input { width:100%; padding:14px 16px; font:inherit; color:inherit; background:var(--panel);
          border:1px solid var(--line); border-radius:10px; outline:none; }
  input:focus { border-color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-top:12px; }
  .card.best { border-color:var(--accent); background:var(--soft); }
  .q { font-weight:600; margin:0 0 6px; }
  .a { margin:0; white-space:pre-wrap; }
  .meta { color:var(--muted); font-size:12px; margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; }
  .none { color:var(--muted); margin-top:20px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:28px 0 0; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1 id="titulo"></h1>
  <p class="sub" id="sub"></p>
  <input id="q" type="search" placeholder="Escribí tu pregunta…" autofocus autocomplete="off">
  <div id="out"></div>
</main>
<script>
const DATA = /*__DATOS__*/null;
const STOP = new Set("de la el en y a los las del un una unos unas que es por con para se su al lo como mas o pero sus le ya si no me mi te tu este esta esto ese esa eso hay muy tambien fue ser son cual cuales cuando donde quien quienes".split(" "));
const fold = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const toks = s => (fold(s).match(/[a-z0-9ñ]+/g) || []).filter(t => t.length > 1 && !STOP.has(t)).map(t => t.slice(0, 6));

// Índice BM25 con más peso para la pregunta y sus variantes.
const docs = DATA.cards.map(c => {
  const tf = new Map();
  const add = (text, w) => toks(text).forEach(t => tf.set(t, (tf.get(t) || 0) + w));
  add(c.question, 3); (c.variants || []).forEach(v => add(v, 2)); (c.tags || []).forEach(t => add(t, 2)); add(c.answer, 1);
  let len = 0; tf.forEach(v => len += v);
  return { c, tf, len };
});
const avg = docs.reduce((s, d) => s + d.len, 0) / Math.max(docs.length, 1);
const df = new Map();
docs.forEach(d => d.tf.forEach((_, t) => df.set(t, (df.get(t) || 0) + 1)));

function search(query) {
  const qt = [...new Set(toks(query))];
  if (!qt.length) return [];
  return docs.map(d => {
    let score = 0, hit = 0;
    for (const t of qt) {
      const f = d.tf.get(t); if (!f) continue;
      hit++;
      const idf = Math.log(1 + (docs.length - df.get(t) + 0.5) / (df.get(t) + 0.5));
      score += idf * (f * 2.2) / (f + 1.2 * (0.25 + 0.75 * d.len / avg));
    }
    return { c: d.c, score, cover: hit / qt.length };
  }).filter(r => r.score > 0).sort((a, b) => b.cover - a.cover || b.score - a.score).slice(0, 6);
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function card(r, best) {
  const d = el("div", "card" + (best ? " best" : ""));
  d.append(el("p", "q", r.c.question), el("p", "a", r.c.answer));
  const m = el("div", "meta");
  m.append(el("span", "", r.c.kind || "hecho"));
  (r.c.tags || []).forEach(t => m.append(el("span", "", "#" + t)));
  if (r.cover != null) m.append(el("span", "", Math.round(r.cover * 100) + "% de coincidencia"));
  d.append(m);
  return d;
}
function render() {
  const out = document.getElementById("out"), q = document.getElementById("q").value.trim();
  out.replaceChildren();
  if (!q) { out.append(el("h2", "", "Todo el módulo")); DATA.cards.forEach(c => out.append(card({ c }, false))); return; }
  const res = search(q);
  if (!res.length || res[0].cover < 0.34) { out.append(el("p", "none", "Este módulo no tiene una respuesta para eso.")); }
  if (res.length && res[0].cover >= 0.34) { out.append(card(res[0], true)); res.shift(); }
  if (res.length) { out.append(el("h2", "", "Relacionado")); res.forEach(r => out.append(card(r, false))); }
}
document.getElementById("titulo").textContent = DATA.name;
document.getElementById("sub").textContent = (DATA.description ? DATA.description + " · " : "") + DATA.cards.length + " tarjetas · funciona sin conexión y sin IA";
document.getElementById("q").addEventListener("input", render);
render();
</script>
</body>
</html>
